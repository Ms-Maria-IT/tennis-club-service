server:
  port: 8081

spring:
  application:
    name: tennis-club-service
  
  datasource:
    url: jdbc:h2:mem:club_service_db
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # Redis - disable auto-configuration if not needed
  data:
    redis:
      repositories:
        enabled: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    ratelimiters:
      enabled: true
    resilience4j:
      ratelimiter:
        metrics:
          enabled: true
        events:
          endpoint:
            enabled: true
  metrics:
    tags:
      application: tennis-club-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 100ms, 500ms, 1s
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.tennistournament.clubservice: INFO
    org.springframework: INFO
    org.hibernate: INFO
    
    # External integrations - debug for troubleshooting
    feign: DEBUG
    io.github.resilience4j: INFO
    
  pattern:
    # Structured JSON for production, readable for development
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
    
  file:
    name: logs/app.log
    max-size: 10MB
    max-history: 7

resilience4j:
  ratelimiter:
    instances:
      # Global rate limit for API
      clubApiGlobal:
        limit-for-period: 100          # 100 requests
        limit-refresh-period: 60s      # in 60 seconds
        timeout-duration: 0            # reject if limit exceeded  
      
      # Rate limit for Club Create
      clubCreationStrict:
        limit-for-period: 10           # 10 requests for club creation
        limit-refresh-period: 60s      # in 60 seconds
        timeout-duration: 5s           # waiting 5 seconds if limit exceeded 
