server:
  port: 8081

spring:
  application:
    name: tennis-club-service
  
  datasource:
    url: jdbc:h2:mem:club_service_db
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  metrics:
    tags:
      application: tennis-club-service
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.tennistournament.clubservice: INFO
    org.springframework.web: INFO
    org.hibernate: INFO
